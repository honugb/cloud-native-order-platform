
name: Order Service CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: application/order-service/pom.xml

      - name: Maven Build and Test
        working-directory: application/order-service
        run: mvn -B -U clean verify

      - name: Validate Docker Hub Token
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Running workflow commit: $GITHUB_SHA"

          if [ -z "$DOCKER_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is missing"
            exit 1
          fi

          echo "PASS: Docker Hub token is available"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: '28312'
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: ./application/order-service
          file: ./application/order-service/Dockerfile
          push: true
          tags: |
            28312/order-service:latest
            28312/order-service:sha-${{ github.sha }}
